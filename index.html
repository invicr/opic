<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPIC Practice</title>
  <style>
    :root {
      --bg: #f7f7f3;
      --panel: #ffffff;
      --text: #202124;
      --muted: #646762;
      --line: #ddded8;
      --accent: #246b5f;
      --accent-2: #b64d2f;
      --chip: #eef3f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    .top {
      display: grid;
      gap: 14px;
      padding: 28px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 780px;
      color: var(--muted);
      font-size: 16px;
    }

    .page-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 247, 243, 0.94);
      backdrop-filter: blur(10px);
    }

    .toolbar-inner {
      display: grid;
      gap: 8px;
      padding: 10px 0;
    }

    .nav-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-row::-webkit-scrollbar {
      display: none;
    }

    .nav-button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .nav-label {
      flex: 0 0 auto;
      align-self: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-width: 54px;
    }

    .mode-button {
      min-width: 64px;
      text-align: center;
    }

    .theme-player {
      display: grid;
      gap: 8px;
      padding-top: 4px;
    }

    .control-row,
    .audio-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .control-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .toggle {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    main {
      padding: 28px 0 48px;
    }

    .practice-list {
      display: grid;
      gap: 18px;
    }

    article {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 18px;
    }

    .question-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--accent);
      padding: 4px 10px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    audio {
      flex: 1 1 320px;
      width: 100%;
      min-width: 220px;
      margin: 2px 0;
    }

    .script {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .script li {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      color: #30322f;
    }

    .english,
    .korean,
    .summary-line {
      margin: 0;
    }

    .english {
      font-weight: 650;
    }

    .korean {
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-line {
      color: #30322f;
      font-weight: 650;
    }

    .chunk {
      color: var(--accent-2);
      font-weight: 700;
    }

    .error {
      color: #9b2c1f;
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(100% - 24px, 1100px);
      }

      .top {
        padding-top: 22px;
      }

      article {
        padding: 14px;
      }

      .question-head {
        grid-template-columns: 1fr;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

  </nav>

        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatLine(line) {
      return escapeHtml(line).replaceAll("/", '<span class="chunk">/</span>');
    }

    function cacheBustedPath(path) {
      return `${path}${path.includes("?") ? "&" : "?"}v=${Date.now()}`;
    }

    function parseScriptLines(lines) {
      const contentLines = lines.slice(1).filter(Boolean);
      const pairs = [];

      contentLines.forEach((line) => {
        if (line.startsWith("EN: ")) {
          pairs.push({ english: line.slice(4), korean: "" });
          return;
        }

        if (line.startsWith("KR: ")) {
          if (!pairs.length) pairs.push({ english: "", korean: "" });
          pairs[pairs.length - 1].korean = line.slice(4);
          return;
        }

        pairs.push({ english: line, korean: "" });
      });

      return pairs;
    }

    function getSummaryFile(question) {
      return question.summaryFile || question.scriptFile.replace(/script\.txt$/, "summary.txt");
    }

    function renderScriptLines(article, lines) {
      const list = article.querySelector(".script");
      list.innerHTML = parseScriptLines(lines).map((line) => `
        <li>
          ${line.english && state.viewMode !== "korean" ? `<p class="english">${formatLine(line.english)}</p>` : ""}
          ${line.korean && state.viewMode !== "english" ? `<p class="korean">${formatLine(line.korean)}</p>` : ""}
        </li>
      `).join("");
    }

    function renderSummaryLines(article, lines) {
      const list = article.querySelector(".script");
      const summaryLines = lines.slice(1).filter(Boolean);

      if (!summaryLines.length) {
        list.innerHTML = '<li class="error">요약이 없습니다.</li>';
        return;
      }

      list.innerHTML = summaryLines.map((line) => `
        <li>
          <p class="summary-line">${formatLine(line)}</p>
        </li>
      `).join("");
    }

    function renderMissingSummary(article) {
      const list = article.querySelector(".script");
      list.innerHTML = '<li class="error">이 문항에는 아직 요약이 없습니다.</li>';
    }

    function renderQuestionContent(question, article) {
      if (state.viewMode === "summary") {
        const summaryFile = getSummaryFile(question);

        if (summaryCache.has(summaryFile)) {
          renderSummaryLines(article, summaryCache.get(summaryFile));
          return;
        }

        if (missingSummaryFiles.has(summaryFile)) {
          renderMissingSummary(article);
          return;
        }

        loadSummary(question, article);
        return;
      }

      const lines = scriptCache.get(question.scriptFile);
      if (lines) renderScriptLines(article, lines);
    }

    async function loadScript(question, article) {
      try {
        const response = await fetch(cacheBustedPath(question.scriptFile), { cache: "no-store" });
        if (!response.ok) throw new Error(question.scriptFile);
        const text = await response.text();
        const lines = text.split(/\r?\n/).filter(Boolean);
        scriptCache.set(question.scriptFile, lines);
        renderQuestionContent(question, article);
      } catch {
        const fallback = fallbackScripts[question.scriptFile];
        if (fallback) {
          scriptCache.set(question.scriptFile, fallback);
          renderQuestionContent(question, article);
          return;
        }

        const list = article.querySelector(".script");
        list.innerHTML = `<li class="error">스크립트를 불러오지 못했습니다: ${escapeHtml(question.scriptFile)}</li>`;
      }
    }

    async function loadSummary(question, article) {
      const summaryFile = getSummaryFile(question);

      try {
        const response = await fetch(cacheBustedPath(summaryFile), { cache: "no-store" });
        if (!response.ok) throw new Error(summaryFile);
        const text = await response.text();
        const lines = text.split(/\r?\n/).filter(Boolean);
        summaryCache.set(summaryFile, lines);
        if (state.viewMode === "summary") renderSummaryLines(article, lines);
      } catch {
        const fallback = fallbackSummaries[summaryFile];
        if (fallback) {
          summaryCache.set(summaryFile, fallback);
          if (state.viewMode === "summary") renderSummaryLines(article, fallback);
          return;
        }

        missingSummaryFiles.add(summaryFile);
        if (state.viewMode === "summary") renderMissingSummary(article);
      }
    }

    function getActiveTheme() {
      return studyLibrary[state.themeIndex];
    }

    function stopQuestionAudios() {
      document.querySelectorAll(".question-audio").forEach((audio) => {
        audio.pause();
      });
    }

    function playAudio(audio, onBlocked) {
      const result = audio.play();
      if (result && typeof result.catch === "function") {
        result.catch(() => {
          if (onBlocked) onBlocked();
        });
      }
    }

    function setThemeAudioStatus() {
      const theme = getActiveTheme();
      const question = theme.questions[state.themeAudioIndex];
      if (!state.isThemePlaying || !question) {
        themePlayerStatus.textContent = "대기 중";
        return;
      }

      const statusPrefix = state.isThemePlayBlocked ? "재생 재개 대기 중" : theme.title;
      themePlayerStatus.textContent = `${statusPrefix} ${state.themeAudioIndex + 1}/${theme.questions.length}: ${question.title}`;
    }

    function handleThemeAudioEnded() {
      if (!state.isThemePlaying) return;

      const theme = getActiveTheme();
      const nextIndex = state.themeAudioIndex + 1;

      if (theme.questions.slice(nextIndex).some((question) => question.audioFile)) {
        playThemeAudioAt(nextIndex);
        return;
      }

      if (repeatTheme.checked) {
        playThemeAudioAt(0);
        return;
      }

      state.isThemePlaying = false;
      state.isThemePlayBlocked = false;
      setThemeAudioStatus();
    }

    function retryThemePlayback() {
      if (!state.isThemePlaying || !themeAudio.src || !themeAudio.paused) return;

      if (themeAudio.ended) {
        handleThemeAudioEnded();
        return;
      }

      playAudio(themeAudio, () => {
        state.isThemePlayBlocked = true;
        setThemeAudioStatus();
      });
    }

    function playThemeAudioAt(index) {
      const theme = getActiveTheme();
      const questionIndex = theme.questions.findIndex((item, itemIndex) => itemIndex >= index && item.audioFile);
      const question = theme.questions[questionIndex];
      if (!question) return;

      stopQuestionAudios();
      state.themeAudioIndex = questionIndex;
      state.isThemePlaying = true;
      state.isThemePlayBlocked = false;
      themeAudio.src = question.audioFile;
      setThemeAudioStatus();
      playAudio(themeAudio, () => {
        state.isThemePlayBlocked = true;
        setThemeAudioStatus();
      });
    }

    function stopThemeAudio() {
      state.isThemePlaying = false;
      state.isThemePlayBlocked = false;
      themeAudio.pause();
      themeAudio.removeAttribute("src");
      themeAudio.load();
      setThemeAudioStatus();
    }

    themeAudio.addEventListener("ended", handleThemeAudioEnded);

    themeAudio.addEventListener("play", () => {
      state.isThemePlayBlocked = false;
      setThemeAudioStatus();
    });

    themeAudio.addEventListener("pause", () => {
      if (!state.isThemePlaying || themeAudio.ended) return;
      window.setTimeout(retryThemePlayback, 500);
    });

    playTheme.addEventListener("click", () => {
      playThemeAudioAt(0);
    });

    stopTheme.addEventListener("click", () => {
      stopThemeAudio();
    });

    function renderViewModeNav() {
      const modes = [
        { id: "both", label: "한영" },
        { id: "korean", label: "한글" },
        { id: "english", label: "영어" },
        { id: "summary", label: "요약" },
      ];

      viewModeNav.innerHTML = [
        '<span class="nav-label">View</span>',
        ...modes.map((mode) => `
          <button class="nav-button mode-button${mode.id === state.viewMode ? " active" : ""}" type="button" data-view-mode="${mode.id}">
            ${mode.label}
          </button>
        `),
      ].join("");

      viewModeNav.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.viewMode = button.dataset.viewMode;
          renderViewModeNav();
          renderCachedContent();
        });
      });
    }

    function renderCachedContent() {
      const activeTheme = studyLibrary[state.themeIndex];
      activeTheme.questions.forEach((question, index) => {
        const article = document.getElementById(`q${index + 1}`);
        if (article) renderQuestionContent(question, article);
      });
    }

    function render() {
      const activeTheme = studyLibrary[state.themeIndex];
      stopThemeAudio();

      themeNav.innerHTML = [
        '<span class="nav-label">Theme</span>',
        ...studyLibrary.map((theme, index) => `
          <button class="nav-button${index === state.themeIndex ? " active" : ""}" type="button" data-theme-index="${index}">
            ${escapeHtml(theme.title)}
          </button>
        `),
      ].join("");

      renderViewModeNav();

      themeNav.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.themeIndex = Number(button.dataset.themeIndex);
          render();
        });
      });

      practiceList.innerHTML = activeTheme.questions
        .map((question, index) => `
          <article id="q${index + 1}">
            <div class="question-head">
              <h2>${escapeHtml(question.title)}</h2>
              <span class="tag">${escapeHtml(question.scriptFile)}</span>
            </div>
            ${question.audioFile ? `
              <div class="audio-row">
                <audio class="question-audio" controls preload="metadata" src="${escapeHtml(question.audioFile)}"></audio>
                <label class="toggle">
                  <input type="checkbox" class="repeat-question">
                  문항 반복
                </label>
              </div>
            ` : ""}
            <ul class="script"></ul>
          </article>
        `)
        .join("");

      activeTheme.questions.forEach((question, index) => {
        loadScript(question, document.getElementById(`q${index + 1}`));
      });

      document.querySelectorAll(".question-audio").forEach((audio) => {
        audio.addEventListener("play", () => {
          stopThemeAudio();
        });

        audio.addEventListener("ended", () => {
          const article = audio.closest("article");
          const repeat = article.querySelector(".repeat-question");
          if (!repeat.checked) return;

          audio.currentTime = 0;
          playAudio(audio);
        });
      });
    }

    document.addEventListener("visibilitychange", () => {
      window.setTimeout(retryThemePlayback, 300);
    });

    ["pageshow", "focus", "resize", "orientationchange"].forEach((eventName) => {
      window.addEventListener(eventName, () => {
        window.setTimeout(retryThemePlayback, 300);
      });
    });

    window.setInterval(() => {
      if (!state.isThemePlaying || !themeAudio.src) return;

      if (themeAudio.ended) {
        handleThemeAudioEnded();
        return;
      }

      if (themeAudio.paused && !state.isThemePlayBlocked) {
        retryThemePlayback();
      }
    }, 1000);

    render();
  </script>
</body>
</html>
