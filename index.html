<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPIC Practice</title>
  <style>
    :root {
      --bg: #f7f7f3;
      --panel: #ffffff;
      --text: #202124;
      --muted: #646762;
      --line: #ddded8;
      --accent: #246b5f;
      --accent-2: #b64d2f;
      --chip: #eef3f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    .top {
      display: grid;
      gap: 14px;
      padding: 28px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 780px;
      color: var(--muted);
      font-size: 16px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 247, 243, 0.94);
      backdrop-filter: blur(10px);
    }

    .toolbar-inner {
      display: grid;
      gap: 8px;
      padding: 10px 0;
    }

    .nav-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-row::-webkit-scrollbar {
      display: none;
    }

    .nav-button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .nav-label {
      flex: 0 0 auto;
      align-self: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-width: 54px;
    }

    .mode-button {
      min-width: 64px;
      text-align: center;
    }

    .theme-player {
      display: grid;
      gap: 8px;
      padding-top: 4px;
    }

    .control-row,
    .audio-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .control-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .toggle {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    main {
      padding: 28px 0 48px;
    }

    .practice-list {
      display: grid;
      gap: 18px;
    }

    article {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 18px;
    }

    .question-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--accent);
      padding: 4px 10px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    audio {
      flex: 1 1 320px;
      width: 100%;
      min-width: 220px;
      margin: 2px 0;
    }

    .script {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .script li {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      color: #30322f;
    }

    .english,
    .korean {
      margin: 0;
    }

    .english {
      font-weight: 650;
    }

    .korean {
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
    }

    .chunk {
      color: var(--accent-2);
      font-weight: 700;
    }

    .error {
      color: #9b2c1f;
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(100% - 24px, 1100px);
      }

      .top {
        padding-top: 22px;
      }

      article {
        padding: 14px;
      }

      .question-head {
        grid-template-columns: 1fr;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

      <h1>OPIC Practice</h1>
      <p class="subtitle">테마별 문항을 선택해서 연습합니다. 각 문항은 themes 아래의 script.txt와 audio.wav를 참조합니다.</p>
    </div>
  </header>

  <nav class="toolbar" aria-label="Practice navigation">
    <div class="wrap toolbar-inner">

      <div class="nav-row" id="viewModeNav" aria-label="View mode"></div>
      <div class="theme-player" aria-label="Theme audio controls">
        <div class="control-row">
          <span class="nav-label">Audio</span>
          <button class="control-button" type="button" id="playTheme">테마 전체 듣기</button>
          <button class="control-button" type="button" id="stopTheme">정지</button>
          <label class="toggle">
            <input type="checkbox" id="repeatTheme">
            전체 반복
          </label>
          <span class="status" id="themePlayerStatus">대기 중</span>
        </div>
        <audio controls preload="metadata" id="themeAudio"></audio>
      </div>
    </div>
  </nav>

  <main>

  </main>

        "KR: 그것이 이유이다 / 내가 아직도 그날을 기억하는.",
      ],
      "themes/music/compare/q1/script.txt": [
        "두 장르간 비교",
        "EN: Well... / that's a difficult question.",
        "KR: 음... / 그것은 어려운 질문이다.",
        "EN: When it comes to music, / I can think of two genres: / ballads and K-pop.",
        "KR: 음악에 관해서라면, / 나는 두 장르를 생각할 수 있다: / 발라드와 K-pop.",
        "EN: I like both of them.",
        "KR: 나는 그것들 둘 다 좋아한다.",
        "EN: first, Ballads are calm / and relaxing.",
        "KR: 먼저, 발라드는 차분하다 / 그리고 편안하게 해준다.",
        "EN: I feel relaxed when I listen to it.",
        "KR: 나는 편안하게 느낀다 내가 그것을 들을 때.",
        "EN: On the other hand, / K-pop is really energetic, / and the hooks are really catchy.",
        "KR: 반면에, / K-pop은 정말 에너지가 넘친다, / 그리고 후렴들이 정말 중독성 있다.",
        "EN: It's really awesome. / Maybe you'll like it too.",
        "KR: 그것은 정말 멋지다. / 아마 너도 그것을 좋아할 것이다.",
        "EN: Overall, / I enjoy listening to / both of them.",
        "KR: 전체적으로, / 나는 듣는 것을 즐긴다 / 그것들 둘 다를.",
      ],
      "themes/music/regular/q2/script.txt": [
        "음악 가젯/도구",
        "EN: Well... / these days, /  noise-canceling wireless earbuds / are really popular.",
        "KR: 음... / 요즘에는, / 노이즈 캔슬링 무선 이어버드는 / 정말 인기가 많다.",
        "EN: By the way, my wife gave them to me / for my birthday.",
        "KR: 그런데, 내 아내가 그것들을 나에게 주었다 / 내 생일에.",
        "EN: Anyway, they're great on a plane / because they block out / the noise.",
        "KR: 어쨌든, 그것들은 비행기에서 좋다 / 왜냐하면 그것들이 차단하기 때문에 / 소음을.",
        "EN: So I can just relax / and enjoy my music.",
        "KR: 그래서 나는 그냥 쉴 수 있다 / 그리고 내 음악을 즐길 수 있다.",
        "EN: Also, / there are no wires, / so they're really convenient.",
        "KR: 또한, / 선들이 없다, / 그래서 그것들은 정말 편리하다.",
        "EN: They're a little expensive, / but I highly recommend them.",
        "KR: 그것들은 조금 비싸다, / 하지만 나는 그것들을 강력히 추천한다.",
        "EN: That's why I really like my noise-canceling wiress earbuds.",
        "KR: 그것이 이유이다 내가 정말 좋아하는 내 노이즈 캔슬링 무선 이어버드를.",
      ],
    };

    const state = {
      themeIndex: 0,
      viewMode: "both",
      themeAudioIndex: 0,
      isThemePlaying: false,
    };

    const themeNav = document.getElementById("themeNav");
    const viewModeNav = document.getElementById("viewModeNav");
    const practiceList = document.getElementById("practiceList");
    const themeAudio = document.getElementById("themeAudio");
    const playTheme = document.getElementById("playTheme");
    const stopTheme = document.getElementById("stopTheme");
    const repeatTheme = document.getElementById("repeatTheme");
    const themePlayerStatus = document.getElementById("themePlayerStatus");
    const scriptCache = new Map();

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatLine(line) {
      return escapeHtml(line).replaceAll("/", '<span class="chunk">/</span>');
    }

    function parseScriptLines(lines) {
      const contentLines = lines.slice(1).filter(Boolean);
      const pairs = [];

      contentLines.forEach((line) => {
        if (line.startsWith("EN: ")) {
          pairs.push({ english: line.slice(4), korean: "" });
          return;
        }

        if (line.startsWith("KR: ")) {
          if (!pairs.length) pairs.push({ english: "", korean: "" });
          pairs[pairs.length - 1].korean = line.slice(4);
          return;
        }

        pairs.push({ english: line, korean: "" });
      });

      return pairs;
    }

    function renderScriptLines(article, lines) {
      const list = article.querySelector(".script");
      list.innerHTML = parseScriptLines(lines).map((line) => `
        <li>
          ${line.english && state.viewMode !== "korean" ? `<p class="english">${formatLine(line.english)}</p>` : ""}
          ${line.korean && state.viewMode !== "english" ? `<p class="korean">${formatLine(line.korean)}</p>` : ""}
        </li>
      `).join("");
    }

    async function loadScript(question, article) {
      try {
        const response = await fetch(question.scriptFile);
        if (!response.ok) throw new Error(question.scriptFile);
        const text = await response.text();
        const lines = text.split(/\r?\n/).filter(Boolean);
        scriptCache.set(question.scriptFile, lines);
        renderScriptLines(article, lines);
      } catch {
        const fallback = fallbackScripts[question.scriptFile];
        if (fallback) {
          scriptCache.set(question.scriptFile, fallback);
          renderScriptLines(article, fallback);
          return;
        }

        const list = article.querySelector(".script");
        list.innerHTML = `<li class="error">스크립트를 불러오지 못했습니다: ${escapeHtml(question.scriptFile)}</li>`;
      }
    }

    function getActiveTheme() {
      return studyLibrary[state.themeIndex];
    }

    function stopQuestionAudios() {
      document.querySelectorAll(".question-audio").forEach((audio) => {
        audio.pause();
      });
    }

    function playAudio(audio) {
      const result = audio.play();
      if (result && typeof result.catch === "function") {
        result.catch(() => {});
      }
    }

    function setThemeAudioStatus() {
      const theme = getActiveTheme();
      const question = theme.questions[state.themeAudioIndex];
      if (!state.isThemePlaying || !question) {
        themePlayerStatus.textContent = "대기 중";
        return;
      }

      themePlayerStatus.textContent = `${theme.title} ${state.themeAudioIndex + 1}/${theme.questions.length}: ${question.title}`;
    }

    function playThemeAudioAt(index) {
      const theme = getActiveTheme();
      const question = theme.questions[index];
      if (!question) return;

      stopQuestionAudios();
      state.themeAudioIndex = index;
      state.isThemePlaying = true;
      themeAudio.src = question.audioFile;
      setThemeAudioStatus();
      playAudio(themeAudio);
    }

    function stopThemeAudio() {
      state.isThemePlaying = false;
      themeAudio.pause();
      themeAudio.removeAttribute("src");
      themeAudio.load();
      setThemeAudioStatus();
    }

    themeAudio.addEventListener("ended", () => {
      const theme = getActiveTheme();
      const nextIndex = state.themeAudioIndex + 1;

      if (nextIndex < theme.questions.length) {
        playThemeAudioAt(nextIndex);
        return;
      }

      if (repeatTheme.checked) {
        playThemeAudioAt(0);
        return;
      }

      state.isThemePlaying = false;
      setThemeAudioStatus();
    });

    playTheme.addEventListener("click", () => {
      playThemeAudioAt(0);
    });

    stopTheme.addEventListener("click", () => {
      stopThemeAudio();
    });

    function renderViewModeNav() {
      const modes = [
        { id: "both", label: "한영" },
        { id: "english", label: "영어" },
        { id: "korean", label: "한글" },
      ];

      viewModeNav.innerHTML = [
        '<span class="nav-label">View</span>',
        ...modes.map((mode) => `
          <button class="nav-button mode-button${mode.id === state.viewMode ? " active" : ""}" type="button" data-view-mode="${mode.id}">
            ${mode.label}
          </button>
        `),
      ].join("");

      viewModeNav.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.viewMode = button.dataset.viewMode;
          renderViewModeNav();
          renderCachedScripts();
        });
      });
    }

    function renderCachedScripts() {
      const activeTheme = studyLibrary[state.themeIndex];
      activeTheme.questions.forEach((question, index) => {
        const article = document.getElementById(`q${index + 1}`);
        const lines = scriptCache.get(question.scriptFile);
        if (article && lines) renderScriptLines(article, lines);
      });
    }

    function render() {
      const activeTheme = studyLibrary[state.themeIndex];
      stopThemeAudio();

      themeNav.innerHTML = [
        '<span class="nav-label">Theme</span>',
        ...studyLibrary.map((theme, index) => `
          <button class="nav-button${index === state.themeIndex ? " active" : ""}" type="button" data-theme-index="${index}">
            ${escapeHtml(theme.title)}
          </button>
        `),
      ].join("");

      renderViewModeNav();

      themeNav.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.themeIndex = Number(button.dataset.themeIndex);
          render();
        });
      });

      practiceList.innerHTML = activeTheme.questions
        .map((question, index) => `
          <article id="q${index + 1}">
            <div class="question-head">
              <h2>${escapeHtml(question.title)}</h2>
              <span class="tag">${escapeHtml(question.scriptFile)}</span>
            </div>
            <div class="audio-row">
              <audio class="question-audio" controls preload="metadata" src="${escapeHtml(question.audioFile)}"></audio>
              <label class="toggle">
                <input type="checkbox" class="repeat-question">
                문항 반복
              </label>
            </div>
            <ul class="script"></ul>
          </article>
        `)
        .join("");

      activeTheme.questions.forEach((question, index) => {
        loadScript(question, document.getElementById(`q${index + 1}`));
      });

      document.querySelectorAll(".question-audio").forEach((audio) => {
        audio.addEventListener("play", () => {
          stopThemeAudio();
        });

        audio.addEventListener("ended", () => {
          const article = audio.closest("article");
          const repeat = article.querySelector(".repeat-question");
          if (!repeat.checked) return;

          audio.currentTime = 0;
          playAudio(audio);
        });
      });
    }

    render();
  </script>
</body>
</html>
